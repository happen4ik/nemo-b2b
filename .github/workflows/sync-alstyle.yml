name: 🔄 Al-Style YML-фид (каждые 30 мин)
 
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
 
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
 
      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: 📦 Зависимости
        run: pip install requests lxml
 
      - name: 🔄 Скачать YML и конвертировать
        env:
          ALSTYLE_TOKEN: ${{ secrets.ALSTYLE_TOKEN }}
        run: python scripts/sync_alstyle.py
 
      - name: 💾 Коммит
        run: |
          git config user.name  "Price Bot"
          git config user.email "bot@nemo-b2b"
          git add cloud-data/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            UPDATED=$(TZ='Asia/Almaty' date '+%d.%m.%Y %H:%M')
            git commit -m "📦 Al-Style прайс $UPDATED (Алматы)"
            git push
          fi
